repo_name: "The github repository name. MUST be taken exactly as-is from the 'Repo_name' field in the user prompt. Do NOT infer, generate, or substitute any other value."
cloud_provider: "The cloud provider to be used for the infrastructure (e.g., 'azure', 'aws', 'gcp'). Extract from the prompt."
Resources: |
  ALL resources to be provisioned in a SINGLE JSON structure. MUST be populated from the config values in the prompt. NEVER pass an empty object {}.
  Build the JSON using DEPLOY_TARGET as the resource key and fill values from the config.
  Always include resource_group using RESOURCE_GROUP and LOCATION from the config.
  Example structure:
  {
    "webapp": {
      "name": "<APP_NAME>",
      "location": "<LOCATION>",
      "sku": "<APP_SERVICE_SKU>"
    },
    "resource_group": {
      "name": "<RESOURCE_GROUP>",
      "location": "<LOCATION>"
    }
  }
  DEPLOY_TARGET aliases: app_service, app service, web_app, web app → use "webapp". virtual_machine, virtual machine → use "vm".
